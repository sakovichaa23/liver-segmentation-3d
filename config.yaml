# Конфигурация приложения
seed: 42

# Модель 
model:
  weights: model/best_3d_unet.pth   
  base: 16                       
  device: auto                    

# Предобработка 
preprocessing:
  target_shape: [128, 128, 128]     
  window: [-100, 200]              

# Постобработка
postprocess:
  min_component_voxels: 500         
  closing_iterations: 1             

# База данных
database:
  path: data/liver.db        
